<!doctype html><html><body><script>
// Loaded in a new Chrome process. No emulator, libc, or WASM module is loaded.
window.testResult = (async () => {
    const directory = await (await navigator.storage.getDirectory())
        .getDirectoryHandle('zeal-completed-write-test');
    for (const [name, offset, size, multiplier, add] of [
        ['tf.img', 512, 512, 13, 17], ['eeprom.img', 256, 128, 7, 33],
    ]) {
        const file = await (await directory.getFileHandle(name)).getFile();
        const data = new Uint8Array(await file.slice(offset, offset + size).arrayBuffer());
        if (data.length !== size || !data.every((byte, i) => byte === ((i * multiplier + add) & 255))) {
            throw new Error(`Completed ${name} write did not survive browser termination`);
        }
    }
    return 'PASS: new browser session sees completed writes after abrupt termination, without device teardown';
})();
window.testResult.catch(error => { document.body.append(error.stack); });
</script></body></html>
