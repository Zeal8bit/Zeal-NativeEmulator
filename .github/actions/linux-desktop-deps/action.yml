name: Linux desktop dependencies
description: Install FLTK and SDL3 for Ubuntu builds
runs:
  using: composite
  steps:
    - name: Install dependencies (Linux)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build gcc g++ pkg-config cmake \
          libxft-dev libgl-dev libx11-dev libfontconfig-dev \
          libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

    - name: Checkout FLTK 1.4.5 (Linux)
      uses: actions/checkout@v6
      with:
        repository: fltk/fltk
        ref: a9b1113516ffd15fc7602a6d425a317df30f4720
        path: fltk-src
        persist-credentials: false

    - name: Build FLTK (Linux)
      shell: bash
      run: |
        cmake -S fltk-src -B "$RUNNER_TEMP/fltk-build" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DFLTK_BUILD_TEST=OFF -DFLTK_BACKEND_WAYLAND=OFF
        cmake --build "$RUNNER_TEMP/fltk-build"
        sudo cmake --install "$RUNNER_TEMP/fltk-build"

    # Ubuntu 22.04/24.04 have no SDL3 package: build the pinned release.
    - name: Identify Linux release for SDL3 cache
      id: distro
      shell: bash
      run: |
        source /etc/os-release
        echo "release=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"

    - name: Cache SDL3 (Linux)
      id: sdl3-cache
      uses: actions/cache@v4
      with:
        path: sdl3/linux
        key: sdl3-${{ steps.distro.outputs.release }}-${{ runner.arch }}-${{ hashFiles('tools/build_sdl3.py') }}

    - name: Build SDL3 (Linux)
      if: steps.sdl3-cache.outputs.cache-hit != 'true'
      shell: bash
      run: python3 tools/build_sdl3.py --prefix sdl3/linux
