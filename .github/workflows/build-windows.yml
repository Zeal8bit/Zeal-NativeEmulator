name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check
        uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: gcc:p meson:p ninja:p pkgconf:p fltk:p sdl3:p

      - name: Build desktop and headless executables
        shell: msys2 {0}
        run: |
          meson setup build
          meson compile -C build
          meson test -C build --print-errorlogs
          for exe in build/zeal-native.exe build/zeal-headless.exe; do
            ldd "$exe" | awk '/=> \/ucrt64\/bin\// { print $3 }' | xargs -r -I '{}' cp '{}' build/
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeal-native-windows
          path: |
            build/zeal-native.exe
            build/zeal-headless.exe
            build/*.dll
            build/assets/fonts/*.TTF
            build/assets/resources/gamecontrollerdb.txt
          retention-days: 30
