name: Pull Request Builds

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    uses: ./.github/workflows/build-linux.yml

  build-macos-arm:
    name: Build macOS ARM
    uses: ./.github/workflows/build-macos-arm.yml

  build-macos-intel:
    name: Build macOS Intel
    uses: ./.github/workflows/build-macos-intel.yml

  build-windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml

  test-windows:
    name: Test Windows executables
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download Windows executables
        uses: actions/download-artifact@v8
        with:
          name: zeal-native-windows
          path: build

      - name: Test executables
        shell: pwsh
        run: |
          ./build/zeal-native.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/zeal-headless.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-wasm:
    name: Build WebAssembly
    uses: ./.github/workflows/build-wasm.yml

  build-configurations:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core only
            args: -Dfrontend=none
            headless: false
          - name: headless only
            args: -Dfrontend=headless
            headless: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc pkg-config

      - name: Build with Meson
        uses: ./.github/actions/meson-build
        with:
          meson-args: ${{ matrix.args }}

      - name: Test headless executable
        if: matrix.headless
        run: ./build/zeal-headless --help

  build-sdl-fltk:
    name: Build SDL/FLTK (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            args: ''
          - name: macOS, whole-frame rendering
            runner: macos-latest
            args: -Dscanline_rendering=false
          - name: macOS, profiling
            runner: macos-latest
            args: -Dprofile_render=true -Dshow_fps=true
          - name: Ubuntu 22.04
            runner: ubuntu-22.04
            args: ''
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            args: ''
          - name: Ubuntu 24.04, whole-frame rendering
            runner: ubuntu-24.04
            args: -Dscanline_rendering=false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja pkg-config fltk sdl3

      - name: Install desktop dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-desktop-deps

      - name: Build with Meson (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/meson-build
        with:
          meson-args: -Dfrontend=sdl-fltk ${{ matrix.args }}

      - name: Build with Meson (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/meson-build
        with:
          meson-args: >-
            -Dfrontend=sdl-fltk -Dsdl3_static=true
            -Dpkg_config_path=${{ github.workspace }}/sdl3/linux/lib/pkgconfig
            ${{ matrix.args }}

      - name: Test executable
        run: ./build/zeal-native --help
