name: Pull Request Builds

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    uses: ./.github/workflows/build-linux.yml

  build-macos-arm:
    name: Build macOS ARM
    uses: ./.github/workflows/build-macos-arm.yml

  build-macos-intel:
    name: Build macOS Intel
    uses: ./.github/workflows/build-macos-intel.yml

  build-windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml

  test-windows:
    name: Test Windows executables
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download Windows executables
        uses: actions/download-artifact@v8
        with:
          name: zeal-native-windows
          path: build

      - name: Test executables
        shell: pwsh
        run: |
          ./build/zeal-native.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/zeal-headless.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-wasm:
    name: Build WebAssembly
    uses: ./.github/workflows/build-wasm.yml

  build-configurations:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core only
            args: -Dfrontend=none
            native: false
            headless: false
          - name: headless only
            args: -Dfrontend=headless
            native: false
            headless: true
          - name: Nuklear only
            args: -Dfrontend=nuklear
            native: true
            headless: false
          - name: debugger and scanline disabled
            args: -Dfrontend=both -Denable_debugger=false -Dscanline_rendering=false
            native: true
            headless: true
          - name: profiling enabled
            args: -Dfrontend=both -Dprofile_render=true -Dshow_fps=true
            native: true
            headless: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev meson ninja-build gcc pkg-config cmake

      - name: Build with Meson
        uses: ./.github/actions/meson-build
        with:
          raylib-path: ${{ github.workspace }}/raylib/linux64
          meson-args: ${{ matrix.args }}

      - name: Test graphical executable
        if: matrix.native
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/raylib/linux64/lib
        run: ./build/zeal-native --help

      - name: Test headless executable
        if: matrix.headless
        run: ./build/zeal-headless --help

  build-sdl-fltk:
    name: Build SDL/FLTK (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            args: ''
          - name: macOS, no debugger
            runner: macos-latest
            args: -Denable_debugger=false -Dscanline_rendering=false
          - name: Ubuntu 22.04
            runner: ubuntu-22.04
            args: ''
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            args: ''
          - name: Ubuntu 24.04, no debugger
            runner: ubuntu-24.04
            args: -Denable_debugger=false -Dscanline_rendering=false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja pkg-config fltk sdl3

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc g++ pkg-config cmake \
            libfltk1.3-dev libgl-dev libx11-dev libfontconfig-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      # Ubuntu 22.04/24.04 have no SDL3 package: build the pinned release.
      - name: Cache SDL3 (Linux)
        if: runner.os == 'Linux'
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: sdl3/linux
          key: sdl3-${{ matrix.runner }}-${{ hashFiles('tools/build_sdl3.py') }}

      - name: Build SDL3 (Linux)
        if: runner.os == 'Linux' && steps.sdl3-cache.outputs.cache-hit != 'true'
        run: python3 tools/build_sdl3.py --prefix sdl3/linux

      - name: Build with Meson (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/meson-build
        with:
          meson-args: -Dfrontend=sdl-fltk ${{ matrix.args }}

      - name: Build with Meson (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/meson-build
        with:
          meson-args: >-
            -Dfrontend=sdl-fltk -Dsdl3_static=true
            -Dpkg_config_path=${{ github.workspace }}/sdl3/linux/lib/pkgconfig
            ${{ matrix.args }}

      - name: Test executable
        run: ./build/zeal-fltk --help
