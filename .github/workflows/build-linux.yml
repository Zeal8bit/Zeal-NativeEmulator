name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev meson ninja-build gcc pkg-config cmake

      - name: Build with Meson
        uses: ./.github/actions/meson-build
        with:
          raylib-path: ${{ github.workspace }}/raylib/linux64

      - name: Test executables
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/raylib/linux64/lib
        run: |
          ./build/zeal-native --help
          ./build/zeal-headless --help

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeal-native-linux
          path: |
            build/zeal-native
            build/zeal-headless
          retention-days: 30
