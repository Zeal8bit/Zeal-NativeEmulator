name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxft-dev libxext-dev libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev meson ninja-build gcc g++ pkg-config

      - name: Build FLTK locally
        run: ./tools/build_fltk.sh

      - name: Build with Meson
        uses: ./.github/actions/meson-build
        with:
          meson-args: -Dfltk_config=${{ github.workspace }}/external/fltk-1.4.5/fltk-config
          raylib-path: ${{ github.workspace }}/raylib/linux64

      - name: Test debugger and workspace models
        run: LD_LIBRARY_PATH=${{ github.workspace }}/raylib/linux64/lib meson test -C build --print-errorlogs

      - name: Package runtime dependencies
        run: ./tools/package_desktop.py build linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeal-native-linux
          path: build/package/
          retention-days: 30
