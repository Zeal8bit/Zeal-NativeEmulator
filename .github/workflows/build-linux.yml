name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/linux-desktop-deps

      - name: Build with Meson
        uses: ./.github/actions/meson-build
        with:
          meson-args: -Dsdl3_static=true -Dpkg_config_path=${{ github.workspace }}/sdl3/linux/lib/pkgconfig

      - name: Test executables
        run: |
          ./build/zeal-fltk --help
          ./build/zeal-headless --help

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeal-native-linux
          path: |
            build/zeal-fltk
            build/zeal-headless
            build/assets/fonts/*.TTF
            build/assets/resources/gamecontrollerdb.txt
          retention-days: 30
