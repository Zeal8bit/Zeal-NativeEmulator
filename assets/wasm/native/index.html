<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeal Native WASM Emulator</title>
    <link rel="stylesheet" href="index.css" />
    <script src="zeal.elf.js"></script>
    <script src="libnative/indexeddb.js"></script>
    <script src="libnative/disk-images.js"></script>
    <script src="libnative/hostfs.js"></script>
    <script src="libnative/zeal-native.js"></script>
</head>
<body>
    <div class="canvas_container">
        <canvas id="canvas" tabindex="0" width="640" height="480"></canvas>
    </div>
    <div class="controls">
        <button id="unmute">Unmute</button>
        <button id="reload">Reload</button>
        <button id="save-images">Save Data</button>
        <button id="clear-images">Clear Data</button>
        <button id="mount-hostfs">Mount HostFS</button>
        <label id="hostfs-status" for="mount-hostfs" role="status">HostFS not mounted</label>
        <button id="toggle-debugger">Toggle Debugger</button>
        <button id="toggle-fps">Toggle FPS</button>
        <label>
            <input id="canvas-smoothing" type="checkbox" />
            Canvas Smoothing
        </label>
    </div>
    <div class="console">
        <div>
            <span class="label">Console</span>
            <div id="output"></div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
